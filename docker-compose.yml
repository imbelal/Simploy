services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simploy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simploy"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: { context: ., dockerfile: src/Simploy.Api/Dockerfile }
    ports: ["5000:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=simploy;Username=postgres;Password=postgres"
      UseInMemoryDb: "false"
      # Auth — set these (esp. on a public server) via a .env file or your shell.
      Auth__JwtSecret: "${SIMPLOY_JWT_SECRET:-simploy-dev-jwt-secret-change-me-please-32chars}"
      Auth__AdminUser: "${SIMPLOY_ADMIN_USER:-admin}"
      Auth__AdminPassword: "${SIMPLOY_ADMIN_PASSWORD:-simploy-admin-change-me}"
      # Token the API uses to talk to the Agent (:8089). Must match the Agent's Agent__Token.
      Agent__Token: "${SIMPLOY_AGENT_TOKEN:-simploy-agent-token-change-me}"
      # Optional GitHub App (replaces PATs for private repos). See README.
      GithubApp__AppId: "${SIMPLOY_GH_APP_ID:-}"
      GithubApp__ClientId: "${SIMPLOY_GH_CLIENT_ID:-}"
      GithubApp__ClientSecret: "${SIMPLOY_GH_CLIENT_SECRET:-}"
      GithubApp__Slug: "${SIMPLOY_GH_SLUG:-}"
      GithubApp__PrivateKey: "${SIMPLOY_GH_PRIVATE_KEY:-}"
      GithubApp__PrivateKeyFile: "${SIMPLOY_GH_PRIVATE_KEY_FILE:-}"
    volumes:
      - ./github-app.pem:/run/secrets/github-app.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
    networks:
      default:
      simploy-proxy:
        aliases: [simploy-control]

  # Shared proxy — always comes up with the control plane. The agent writes the
  # routing fragments (apps dir) and reloads this container on deploys.
  caddy:
    image: caddy:latest
    container_name: simploy-caddy
    restart: unless-stopped
    networks:
      - simploy-proxy
    ports: ["80:80", "443:443"]
    volumes:
      - /opt/simploy/.proxy/Caddyfile:/etc/caddy/Caddyfile
      - /opt/simploy/.proxy/apps:/etc/caddy/apps

volumes:
  pgdata:

networks:
  simploy-proxy:
    external: true
