services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simploy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: { context: ., dockerfile: src/Simploy.Api/Dockerfile }
    ports: ["5000:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=simploy;Username=postgres;Password=postgres"
      UseInMemoryDb: "false"
    depends_on: [postgres]

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
